name: Guard a release on its declaration (declare-certify)
description: >-
  Download a declaration record artifact and fail the job while the
  declaration is still OPEN. Put this in (or before) the job that
  publishes/tags the release: an uncertified release cannot pass.

inputs:
  declaration-id:
    description: "The declaration id to check"
    required: true
  artifact-name:
    description: "Name of the artifact carrying the declaration record (use the closed record's artifact when a certify job ran)"
    required: false
    default: "declaration-closed"
  store-dir:
    description: "Directory (relative to the workspace) the record is staged in"
    required: false
    default: ".declare-certify"

runs:
  using: composite
  steps:
    - name: Download the declaration record
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.store-dir }}

    - name: The declaration must be CLOSED
      shell: bash
      env:
        DECLARE_CERTIFY_DIR: ${{ github.workspace }}/${{ inputs.store-dir }}
        DC_ID: ${{ inputs.declaration-id }}
      run: |
        # check exits 2 while the declaration is OPEN -> this step fails,
        # the job fails, and the release step that needs this job never runs.
        python3 "${{ github.action_path }}/../declare_certify.py" check --id "$DC_ID"
